se,"verification":"official","source_url":"https://www.lincoln.edu/admissions/undergraduate/apply/first-year-student.html","prompts":[]},"Benedict College":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.commonapp.org/explore/benedict-college-columbia-sc","prompts":[]},"Stillman College":{"common_app":null,"has_supplement":false,"verification":"official","source_url":"https://catalog.stillman.edu/node/63","prompts":[]},"Miles College":{"common_app":false,"has_supplement":false,"verification":"official","source_url":"https://miles.edu/admissions-aid/how-apply","prompts":[]},"Tougaloo College":{"common_app":null,"has_supplement":false,"verification":"official","source_url":"https://www.tougaloo.edu/node/229","prompts":[]},"Brown University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admission.brown.edu/first-year/brown-first-year-application-questions","prompts":[{"text":"\"There is something distinctive about Brown students. It is a blend of intellectual curiosity, creativity, and humility. A commitment to collaboration. An openness to new ideas and perspectives. A desire to make the world better. And it is resilience: the ability to recover and thrive after experiencing difficulties.\" How will you use these characteristics or others to shape your approach to the Open Curriculum?","limit":"150-250 words","required":true,"applies_to":"All applicants"},{"text":"Students entering Brown often find that making their home on College Hill naturally invites reflection on where they came from. Share how an aspect of your growing up has inspired or challenged you, and what unique contributions this might allow you to make to the Brown community.","limit":"150-250 words","required":true,"applies_to":"All applicants"},{"text":"Brown students care deeply about their work and the world around them. Students find contentment, satisfaction, and meaning in daily interactions and major discoveries. Whether big or small, mundane or spectacular, tell us about something that brings you joy.","limit":"100-150 words","required":true,"applies_to":"All applicants"},{"text":"If you could teach a class on any one thing, whether academic or otherwise, what would it be?","limit":"100-150 words","required":true,"applies_to":"All applicants"},{"text":"Why medicine?","limit":"250 words","required":true,"applies_to":"Program in Liberal Medical Education (PLME) applicants"},{"text":"Why PLME?","limit":"250 words","required":true,"applies_to":"Program in Liberal Medical Education (PLME) applicants"}]},"Columbia University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://undergrad.admissions.columbia.edu/apply/process/columbia-questions","prompts":[{"text":"List the titles of texts, resources and outlets that have contributed to your intellectual development outside of academic courses, including but not limited to books, journals, websites, podcasts, essays, plays, presentations, videos, museums and other content that you enjoy.","limit":"100 words or fewer","required":true,"applies_to":"All applicants"},{"text":"Tell us about an aspect of your life so far or your lived experience that is important to you, and describe how it has shaped the way you would learn from and contribute to Columbia's multidimensional and collaborative environment.","limit":"150 words or fewer","required":true,"applies_to":"All applicants"},{"text":"At Columbia, students representing a wide range of perspectives are invited to live and learn together. In such a community, questions and debates naturally arise. Please describe a time when you did not agree with someone and discuss how you engaged with them and what you took away from the interaction.","limit":"150 words or fewer","required":true,"applies_to":"All applicants"},{"text":"In college/university, students are often challenged in ways that they could not anticipate. Please describe a situation in which you have navigated through adversity and discuss how you changed as a result.","limit":"150 words or fewer","required":true,"applies_to":"All applicants"},{"text":"Why are you interested in attending Columbia University? We encourage you to consider the aspect(s) that you find unique and compelling about Columbia.","limit":"150 words or fewer","required":true,"applies_to":"All applicants"},{"text":"What attracts you to your preferred areas of study at Columbia College or Columbia Engineering?","limit":"150 words or fewer","required":true,"applies_to":"All applicants"}]},"Cornell University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admissions.cornell.edu/how-to-apply/first-year-applicants/cornell-first-year-writing-supplement-prompts","prompts":[{"text":"At the College of Arts & Sciences, your education is yours to shape. Describe an intellectual passion, question, or idea that has captured your attention - whether it emerges from your studies or extends beyond your coursework. What specific aspects of our liberal arts curriculum would you draw on to explore and connect your varied interests?","limit":"650 words","required":true,"applies_to":"College of Arts & Sciences applicants"},{"text":"What kind of business student are you? Using your personal, academic, or volunteer/work experiences, describe the topics or issues that you care about and why they are important to you. Your response should convey how your interests align with the school to which you are applying within the Cornell SC Johnson College of Business (the Charles H. Dyson School of Applied Economics and Management or the Cornell Peter and Stephanie Nolan School of Hotel Administration).","limit":"650 words","required":true,"applies_to":"SC Johnson College of Business applicants"}]},"Dartmouth College":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admissions.dartmouth.edu/apply/application-materials/writing-supplement","prompts":[{"text":"As you seek admission to Dartmouth's Class of 2031, what aspects of the college's academic program, community, and/or campus environment attract your interest? How is Dartmouth a good fit for you?","limit":"100 words or fewer","required":true,"applies_to":"All applicants"},{"text":"Required of all applicants, please respond to one of the following prompts in 250 words or fewer: A. There is a Quaker saying: Let your life speak. Describe the environment in which you were raised and the impact it has had on the person you are today. B. \"Be yourself,\" Oscar Wilde advised. \"Everyone else is taken.\" Introduce yourself.","limit":"250 words or fewer","required":true,"applies_to":"All applicants"},{"text":"Required of all applicants, please respond to one of the following prompts in 250 words or fewer: A. What excites you? B. Labor leader and civil rights activist Dolores Huerta recommended a life of purpose. \"We must use our lives to make the world a better place to live, not just to acquire things,\" she said. \"That is what we are put on the earth for.\" In what ways do you hope to make - or are you already making - an impact? Why? How? C. In an Instagram post, best-selling British author Matt Haig cheered the impact of reading. \"A good novel is the best invention humans have ever created for imagining other lives,\" he wrote. How have you experienced such insight from reading? What did you read and how did it alter the way you understand yourself and others? D. The social and family interactions of wild chimpanzees have been the focus of Dame Jane Goodall's research for decades. Her understanding of animal behavior prompted the English primatologist to see a lesson for human communities as well: \"Change happens by listening and then starting a dialogue with the people who are doing something you don't believe is right.\" Channel Dame Goodall: Tell us about a moment when you engaged in a difficult conversation or encountered someone with an opinion or perspective that was different from your own. How did you find common ground? E. Celebrate your nerdy side. F. \"It's not easy being green…\" was the frequent refrain of Kermit the Frog. How has difference been a part of your life, and how have you embraced it as part of your identity, outlook, or sense of purpose?","limit":"250 words or fewer","required":true,"applies_to":"All applicants"}]},"Harvard University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://college.harvard.edu/admissions/apply/application-requirements","prompts":[{"text":"Harvard has long recognized the importance of enrolling a student body with a diversity of perspectives and experiences. How will the life experiences that shaped who you are today enable you to contribute to Harvard?","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"Describe a time when you strongly disagreed with someone about an idea or issue. How did you communicate or engage with this person? What did you learn from this experience?","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"Briefly describe any of your extracurricular activities, employment experience, travel, or family responsibilities that have shaped who you are.","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"How do you hope to use your Harvard education in the future?","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"Top 3 things your roommates might like to know about you.","limit":"150 words","required":true,"applies_to":"All applicants"}]},"University of Pennsylvania":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admissions.upenn.edu/how-to-apply/preparing-your-application/essays","prompts":[{"text":"Write a short thank-you note to someone you have not yet thanked and would like to acknowledge. (We encourage you to share this note with that person, if possible, and reflect on the experience!)","limit":"Up to 200 words","required":true,"applies_to":"All applicants"},{"text":"How will you explore community at Penn? Consider how Penn will help shape your perspective, and how your experiences and perspective will help shape Penn.","limit":"Up to 200 words","required":true,"applies_to":"All applicants"},{"text":"The College of Arts and Sciences is designed to foster discovery and connection. Describe something you are curious about - something you'd like to learn more about or find a new approach to - and how you might pursue that curiosity in the College.","limit":"Up to 200 words","required":true,"applies_to":"College of Arts and Sciences applicants"},{"text":"Wharton prepares its students to make an impact by applying business methods and economic theory to real-world problems, including economic, political, and social issues. Please reflect on a current issue of importance to you and share how you hope a Wharton education would help you to explore it.","limit":"Up to 200 words","required":true,"applies_to":"Wharton applicants"}]},"Princeton University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admission.princeton.edu/apply/princeton-specific-questions","prompts":[{"text":"As a research institution that also prides itself on its liberal arts curriculum, Princeton allows students to explore areas across the humanities and the arts, the natural sciences, and the social sciences. What academic areas most pique your curiosity, and how do the programs offered at Princeton suit your particular interests?","limit":"250 words or fewer","required":true,"applies_to":"A.B. degree applicants or those who are undecided"},{"text":"Please describe why you are interested in studying engineering at Princeton. Include any of your experiences in or exposure to engineering, and how you think the programs offered at the University suit your particular interests.","limit":"250 words or fewer","required":true,"applies_to":"B.S.E. degree applicants"},{"text":"Princeton values community and encourages students, faculty, staff and leadership to engage in respectful conversations that can expand their perspectives and challenge their ideas and beliefs. As a prospective member of this community, reflect on how your lived experiences will impact the conversations you will have in the classroom, the dining hall or other campus spaces. What lessons have you learned in life thus far? What will your classmates learn from you? In short, how has your lived experience shaped you?","limit":"400-500 words","required":true,"applies_to":"All applicants"},{"text":"Princeton has a longstanding commitment to understanding our responsibility to society through service and civic engagement. How does your own story intersect with these ideals?","limit":"250 words or fewer","required":true,"applies_to":"All applicants"},{"text":"What is a new skill you would like to learn in college?","limit":"50 words or fewer","required":true,"applies_to":"All applicants"},{"text":"What brings you joy?","limit":"50 words or fewer","required":true,"applies_to":"All applicants"},{"text":"What song represents the soundtrack of your life at this moment?","limit":"50 words or fewer","required":true,"applies_to":"All applicants"}]},"Yale University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.yale.edu/essay-topics","prompts":[{"text":"Students at Yale have time to explore their academic interests before committing to one or more major fields of study. Many students either modify their original academic direction or change their minds entirely. As of this moment, what academic areas seem to fit your interests or goals most comfortably? Please indicate up to three from the list provided.","limit":"","required":true,"applies_to":"All applicants"},{"text":"Tell us about a topic or idea that excites you and is related to one or more academic areas you selected above. Why are you drawn to it?","limit":"200 words or fewer","required":true,"applies_to":"All applicants"},{"text":"If you could teach any college course, write a book, or create an original piece of art of any kind, what would it be?","limit":"200 characters (approximately 35 words)","required":true,"applies_to":"Common App and Coalition App applicants"},{"text":"What is one aspect of yourself that you hope to grow or develop during college?","limit":"200 characters (approximately 35 words)","required":true,"applies_to":"Common App and Coalition App applicants"},{"text":"What is something about you that is not included anywhere else in your application?","limit":"200 characters (approximately 35 words)","required":true,"applies_to":"Common App and Coalition App applicants"},{"text":"Please respond to one of the following prompts: 1. Reflect on a time you discussed an issue important to you with someone holding an opposing view. Why did you find the experience meaningful? 2. Reflect on your membership in a community to which you feel connected. Why is this community meaningful to you? You may define community however you like. 3. Reflect on an element of your personal experience that you feel will enrich your college. How has it shaped you?","limit":"400 words or fewer","required":true,"applies_to":"Common App and Coalition App applicants"}]},"Stanford University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admission.stanford.edu/apply/first-year/apply.html","prompts":[{"text":"What is the most significant challenge that society faces today?","limit":"50 words maximum","required":true,"applies_to":"All applicants"},{"text":"How did you spend your last two summers?","limit":"50 words maximum","required":true,"applies_to":"All applicants"},{"text":"What historical moment or event do you wish you could have witnessed?","limit":"50 words maximum","required":true,"applies_to":"All applicants"},{"text":"Briefly elaborate on one of your extracurricular activities, a job you hold, or responsibilities you have for your family.","limit":"50 words maximum","required":true,"applies_to":"All applicants"},{"text":"List five things that are important to you.","limit":"50 words maximum","required":true,"applies_to":"All applicants"},{"text":"The Stanford community is deeply curious and driven to learn in and out of the classroom. Reflect on an idea or experience that makes you genuinely excited about learning.","limit":"100-250 words","required":true,"applies_to":"All applicants"},{"text":"Virtually all of Stanford's undergraduates live on campus. Write a note to your future roommate that reveals something about you or that will help your roommate - and us - get to know you better.","limit":"100-250 words","required":true,"applies_to":"All applicants"},{"text":"Please describe what aspects of your life experiences, interests, and character would help you make a distinctive contribution as an undergraduate to Stanford University.","limit":"100-250 words","required":true,"applies_to":"All applicants"}]},"Massachusetts Institute of Technology":{"common_app":false,"has_supplement":true,"verification":"official","source_url":"https://mitadmissions.org/apply/firstyear/essays-activities-academics/","prompts":[{"text":"What field of study appeals to you the most right now? (Note: Applicants select from a drop-down list.) Reflect on what has led you to this interest.","limit":"approximately 100-200 words","required":true,"applies_to":"All applicants"},{"text":"While some reach their goals following well-trodden paths, others blaze their own trails achieving the unexpected. In what ways have you done something different than what was expected in your educational journey?","limit":"approximately 100-200 words","required":true,"applies_to":"All applicants"},{"text":"How have your personal and academic experiences influenced the types of problems you would want to tackle with an MIT education and the impact you aim to make on your community?","limit":"approximately 100-200 words","required":true,"applies_to":"All applicants"},{"text":"How did you manage a situation or challenge that you didn't expect? What did you learn from it?","limit":"approximately 100-200 words","required":true,"applies_to":"All applicants"},{"text":"What do you do just for fun?","limit":"40-50 words","required":true,"applies_to":"All applicants"},{"text":"Who is someone you admire, whether you know them personally or look up to them from afar? Tell us why.","limit":"40-50 words","required":true,"applies_to":"All applicants"},{"text":"What's a topic, academic or non-academic, that you could talk about for hours?","limit":"40-50 words","required":true,"applies_to":"All applicants"},{"text":"MIT values both \"generalists\" with varied interests and \"specialists\" who focus deeply on one or a few passions. Which do you think best describes you, and why?","limit":"40-50 words","required":true,"applies_to":"All applicants"}]},"Duke University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.duke.edu/apply/","prompts":[{"text":"What is your impression of Duke as a university and community, and why do you believe it is a good match for your goals, values, and interests? If there is something specific that attracts you to our academic offerings in Trinity College of Arts and Sciences or the Pratt School of Engineering, or to our co-curricular opportunities, feel free to include that, too.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"We all belong to communities defined by place, faith, family, culture, interests or shared experience. Tell us about a community that has shaped who you are, any way it has set you apart, and what you've learned from being part of it that you hope to bring to Duke.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"We believe a wide range of viewpoints and experiences is essential to maintaining Duke's vibrant living and learning community. Please share anything in this context that might help us better understand you and your potential contributions to Duke.","limit":"250 words","required":false,"applies_to":"All applicants (optional; answer at most one of the three optional prompts)"},{"text":"Meaningful dialogue often involves respectful disagreement. Provide an example of a difference of opinion you've had with someone you care about. What did you learn from it?","limit":"250 words","required":false,"applies_to":"All applicants (optional; answer at most one of the three optional prompts)"},{"text":"What's the last thing that you've been really excited about?","limit":"250 words","required":false,"applies_to":"All applicants (optional; answer at most one of the three optional prompts)"}]},"Vanderbilt University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admissions.vanderbilt.edu/apply/","prompts":[{"text":"Vanderbilt University's motto, Crescere aude, is Latin for \"dare to grow.\" In your response, reflect on how one or more aspects of your identity, culture, or background has played a role in your personal growth, and how it will contribute to our campus community as you dare to grow at Vanderbilt.","limit":"approximately 250 words","required":true,"applies_to":"All applicants"}]},"Rice University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admission.rice.edu/apply/first-year-domestic-applicants","prompts":[{"text":"Please explain what draws you to the academic areas you selected above and how you hope to explore them at Rice University.","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"Based upon your exploration of Rice University, what elements of the Rice experience appeal to you?","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"Please respond to one of the following prompts: A. The Residential College System is at the heart of Rice student life and is heavily influenced by the particular cultural traditions and unique life experiences each student brings. What life experiences and/or unique perspectives are you looking forward to sharing with fellow Owls in the residential college system? B. Rice is strengthened by its diverse community of learning and discovery that produces leaders and change agents across the spectrum of human endeavor. What perspectives shaped by your background, experiences, upbringing, and/or cultural identity inspire you to join our community of change agents at Rice?","limit":"500 words","required":true,"applies_to":"All applicants"},{"text":"Why are you determined to study architecture? Please explain your motivation and describe how your past experiences have led you to apply to the Rice School of Architecture in particular. Have you had an opportunity outside of school - such as an internship, building project, architecture summer program or other experience - that strengthened your interest in the field? If so, please describe how the experience further compels you to pursue a career in architecture.","limit":"250 words","required":true,"applies_to":"School of Architecture applicants"},{"text":"Describe a building, place, or city that you have encountered and found especially compelling. What specifically captured your attention, and why? In your response, reflect on how this experience has shaped your understanding of architecture and the built environment.","limit":"250 words","required":true,"applies_to":"School of Architecture applicants"}]},"Northwestern University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admissions.northwestern.edu/apply/requirements.html","prompts":[{"text":"We want to be sure we're considering your application in the context of your personal experiences: What aspects of your background (your identity, your school setting, your community, your household, etc.) have most shaped how you see yourself engaging in Northwestern's community, be it academically, extracurricularly, culturally, politically, socially, or otherwise?","limit":"300 words or fewer","required":true,"applies_to":"All applicants"},{"text":"Painting \"The Rock\" is a tradition at Northwestern that invites all forms of expression - students promote campus events or extracurricular groups, support social or activist causes, show their Wildcat spirit (what we call \"Purple Pride\"), celebrate their culture, and more. What would you paint on The Rock, and why?","limit":"fewer than 200 words","required":false,"applies_to":"All applicants (optional; answer one or two of the five optional questions)"},{"text":"Northwestern fosters a distinctively interdisciplinary culture. We believe discovery and innovation thrive at the intersection of diverse ideas, perspectives, and academic interests. Within this setting, if you could dream up an undergraduate class, research project, or creative effort (a start-up, a design prototype, a performance, etc.), what would it be? Who might be some ideal classmates or collaborators?","limit":"fewer than 200 words","required":false,"applies_to":"All applicants (optional; answer one or two of the five optional questions)"},{"text":"Community and belonging matter at Northwestern. Tell us about one or more communities, networks, or student groups you see yourself connecting with on campus.","limit":"fewer than 200 words","required":false,"applies_to":"All applicants (optional; answer one or two of the five optional questions)"},{"text":"Northwestern's location is special: on the shore of Lake Michigan, steps from downtown Evanston, just a few miles from Chicago. What aspects of our location are most compelling to you, and why?","limit":"fewer than 200 words","required":false,"applies_to":"All applicants (optional; answer one or two of the five optional questions)"},{"text":"Northwestern is a place where people with diverse backgrounds from all over the world can study, live, and talk with one another. This range of experiences and viewpoints immeasurably enriches learning. How might your individual background contribute to this diversity of perspectives in Northwestern's classrooms and around our campus?","limit":"fewer than 200 words","required":false,"applies_to":"All applicants (optional; answer one or two of the five optional questions)"}]},"Johns Hopkins University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://apply.jhu.edu/how-to-apply/application-essay-prompts/","prompts":[{"text":"At Johns Hopkins, community is built through dialogue, collaboration, and a willingness to engage across differences. Whether on campus or in the broader world, community depends on bridge builders who can listen to differing perspectives, challenge their own assumptions, or work together toward shared goals. Drawing on your own experiences, what have you learned about engaging across differences and how has it shaped the way you think about building bridges, enhancing community, and working with others?","limit":"350 words","required":true,"applies_to":"All applicants"}]},"University of Chicago":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://collegeadmissions.uchicago.edu/apply/uchicago-supplemental-essay-questions","prompts":[{"text":"How does the University of Chicago, as you know it now, satisfy your desire for a particular kind of learning, community, and future? Please address with some specificity your own wishes and how they relate to UChicago.","limit":"1-2 pages","required":true,"applies_to":"All applicants"},{"text":"Food for thought: How do thoughts eat?","limit":"1-2 pages","required":true,"applies_to":"Extended essay: all applicants choose one option"},{"text":"The James Webb Space Telescope, launched in 2021, utilized origami-inspired techniques to compactly store and deploy its sunshield in space. Choose an artistic practice and use its principles to propose an elegant solution to a problem.","limit":"1-2 pages","required":true,"applies_to":"Extended essay: all applicants choose one option"},{"text":"Sometimes metaphors get mixed up. For one reason or another, one could say, \"we'll burn that bridge when we get there\" or \"the world is your china shop\". Make up your own mixed metaphor. Explain how it could make sense, be understood, or even applied.","limit":"1-2 pages","required":true,"applies_to":"Extended essay: all applicants choose one option"},{"text":"The Olympics have long celebrated the pinnacle of human athletic achievement. But what if they expanded to honor the mundane? Imagine a new Olympic event built around an everyday activity like speed dishwashing or competitive grocery bagging. How is it scored, officiated, and judged? Why is it a worthy addition?","limit":"1-2 pages","required":true,"applies_to":"Extended essay: all applicants choose one option"},{"text":"And, as always… the classic choose your own adventure option! In the spirit of adventurous inquiry, choose one of our past prompts (or create a question of your own). Be original, creative, thought provoking. Draw on your best qualities as a writer, thinker, visionary, social critic, sage, citizen of the world, or future citizen of the University of Chicago; take a little risk, and have fun!","limit":"1-2 pages","required":true,"applies_to":"Extended essay: all applicants choose one option"}]},"Georgetown University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://uadmissions.georgetown.edu/apply/first-year-applicants/application-requirements-and-forms/","prompts":[{"text":"Briefly discuss the significance to you of the school or summer activity in which you have been most involved.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"In all our lives, we interact with people who hold different viewpoints than our own. Describe such an event you experienced. What did you learn from the experience?","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"As Georgetown is a diverse community, the Admissions Committee would like to know more about you in your own words. Please submit a brief personal or creative essay which you feel best describes you and reflects on your personal background and individual experiences, skills, and talents.","limit":"650 words","required":true,"applies_to":"All applicants"},{"text":"Founded in 1789, the Georgetown College of Arts & Sciences is committed to the Jesuit traditions of an integrated education and of productive research in the natural sciences, humanities, social sciences, and fine arts. Describe your interest in studying in the College of Arts & Sciences. Applicants interested in the sciences, mathematics, or languages are encouraged to make specific reference to their choice of major.","limit":"500 words","required":true,"applies_to":"Applicants to the College of Arts & Sciences"},{"text":"Georgetown University's McDonough School of Business provides graduates with essential global, ethical, analytical, financial, and diverse perspectives on the economies of our nation and the world. Describe your primary motivations for studying business at Georgetown University.","limit":"500 words","required":true,"applies_to":"Applicants to the McDonough School of Business"}]},"Washington University in St. Louis":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.washu.edu/how-to-apply/first-year-us-applicants/","prompts":[{"text":"Please tell us what you are interested in studying at college and why.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"The Beyond Boundaries Program equips students with a set of tools to critically understand and make a difference in a complicated world where challenges require varied perspectives and skill sets. What is the big societal issue you would like to tackle? Who would you need on your team? How would the Beyond Boundaries Program support you to work with collaborative teams to address this issue?","limit":"250 words","required":true,"applies_to":"Only applicants who select the Beyond Boundaries Program"}]},"University of Notre Dame":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.nd.edu/apply/application-overview/","prompts":[{"text":"Everyone has different priorities when considering their higher education options and building their college or university list. Tell us about your \"non-negotiable\" factor(s) when searching for your future college home.","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"How does faith influence the decisions you make?","limit":"50-100 words","required":true,"applies_to":"All applicants choose two of the four short-answer questions"},{"text":"What is distinctive about your personal experiences and development (eg, family support, culture, disability, personal background, community)? Why are these experiences important to you and how will you enrich the Notre Dame community?","limit":"50-100 words","required":true,"applies_to":"All applicants choose two of the four short-answer questions"},{"text":"Notre Dame's undergraduate experience is characterized by a collective sense of care for every person. How do you foster service to others in your community?","limit":"50-100 words","required":true,"applies_to":"All applicants choose two of the four short-answer questions"},{"text":"What would you fight for?","limit":"50-100 words","required":true,"applies_to":"All applicants choose two of the four short-answer questions"}]},"Carnegie Mellon University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegetransitions.com/blog/carnegie-mellon-essay-prompts/","prompts":[{"text":"Most students choose their intended major or area of study based on a passion or inspiration that's developed over time – what passion or inspiration led you to choose this area of study?","limit":"300 words","required":true,"applies_to":"All applicants"},{"text":"Many students pursue college for a specific degree, career opportunity or personal goal. Whichever it may be, learning will be critical to achieve your ultimate goal. As you think ahead to the process of learning during your college years, how will you define a successful college experience?","limit":"300 words","required":true,"applies_to":"All applicants"},{"text":"Consider your application as a whole. What do you personally want to emphasize about your application for the admission committee's consideration? Highlight something that's important to you or something you haven't had a chance to share. Tell us, don't show us (no websites please).","limit":"300 words","required":true,"applies_to":"All applicants"}]},"New York University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/new-york-university-nyu-supplemental-essay-prompt-guide/","prompts":[{"text":"Tell us about a time you encountered a perspective different from your own. What did you learn - about yourself, the other person, or the world?","limit":"250 words","required":false,"applies_to":"Optional: one 250-word essay responding to one or more of the three questions"},{"text":"Tell us about an experience you've had working with others who have different backgrounds or perspectives. What challenges did your group face? Did you overcome them, and if so, how? What role did you try to play in helping people to work together, and what did you learn from your efforts?","limit":"250 words","required":false,"applies_to":"Optional: one 250-word essay responding to one or more of the three questions"},{"text":"Tell us about someone you've observed who does a particularly good job helping people think or work together. How does this person set the stage for common exploration or work? How do they react when difficulties or dissensions arise?","limit":"250 words","required":false,"applies_to":"Optional: one 250-word essay responding to one or more of the three questions"}]},"University of Southern California":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/university-of-southern-california-usc-supplemental-essay-prompt-guide/","prompts":[{"text":"Describe how you plan to pursue your academic interests at USC. Please feel free to address your first- and second-choice major selections.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"Describe a time when you disagreed with someone you know about something important to you. Did you change your mind or reach common ground?","limit":"Approximately 250 words","required":false,"applies_to":"All applicants"},{"text":"Describe yourself in three words.","limit":"25 characters each","required":true,"applies_to":"All applicants (short answer)"},{"text":"What is your favorite snack?","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"Best movie of all time:","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"Dream job:","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"If your life had a theme song, what would it be?","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"Dream trip:","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"What TV show will you binge watch next?","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"Which well-known person or fictional character would be your ideal roommate?","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"Favorite book:","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"},{"text":"If you could teach a class on any topic, what would it be?","limit":"100 characters","required":true,"applies_to":"All applicants (short answer)"}]},"Tufts University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.tufts.edu/apply/short-answer-questions/","prompts":[{"text":"Please describe how you have learned about and engaged with Tufts during your college search process (75-150 words).","limit":"75-150 words","required":true,"applies_to":"All applicants"},{"text":"Tell us about one of your favorite school assignments in the past two years. What was the assignment and why did you enjoy it?","limit":"100-200 words","required":true,"applies_to":"Applicants to the School of Arts and Sciences"},{"text":"Tell us about an engineering or science-related project that you have helped build, design, create, or iterate in the past two years. What was the project and what was your role?","limit":"100-200 words","required":true,"applies_to":"Applicants to the School of Engineering"}]},"Boston University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.bu.edu/admissions/apply/first-year/","prompts":[{"text":"What about being a student at BU most excites you? How do you hope to contribute to our campus community?","limit":"300 words","required":true,"applies_to":"All applicants"}]},"Boston College":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://www.bc.edu/admission/apply/","prompts":[{"text":"Strong communities are sustained by traditions. Boston College's annual calendar is marked with both long-standing and newer traditions that help shape our community. Tell us about a meaningful tradition in your family or community. Why is it important to you, and how does it bring people together or strengthen the bonds of those who participate?","limit":"400 words","required":true,"applies_to":"All applicants except Human-Centered Engineering choose one of four"},{"text":"The late BC theology professor, Father Michael Himes, argued that a university is not a place to which you go, but instead, a \"rigorous and sustained conversation about the great questions of human existence, among the widest possible circle of the best possible conversation partners.\" Who has been your most meaningful conversation partner, and what profound questions have you considered together?","limit":"400 words","required":true,"applies_to":"All applicants except Human-Centered Engineering choose one of four"},{"text":"In her July 2009 Ted Talk, \"The Danger of a Single Story,\" Chimamanda Ngozi Adichie warned viewers against assigning people a \"single story\" through assumptions about their nationality, appearance, or background. Discuss a time when someone defined you by a single story. What challenges did this present and how did you overcome them?","limit":"400 words","required":true,"applies_to":"All applicants except Human-Centered Engineering choose one of four"},{"text":"Boston College's Jesuit mission highlights \"the three Be's\": be attentive, be reflective, be loving – core to Jesuit education (see A Pocket Guide to Jesuit Education). If you could add a fourth \"Be,\" what would it be and why? How would this new value support your personal development and enrich the BC community?","limit":"400 words","required":true,"applies_to":"All applicants except Human-Centered Engineering choose one of four"},{"text":"One goal of a Jesuit education is to prepare students to serve the Common Good. Human-Centered Engineering at Boston College integrates technical knowledge, creativity, and a humanistic perspective to address societal challenges and opportunities. What societal problems are important to you and how will you use your HCE education to solve them?","limit":"400 words","required":true,"applies_to":"Human-Centered Engineering applicants only (instead of the other four)"}]},"Northeastern University":{"common_app":true,"has_supplement":false,"verification":"secondary","source_url":"https://admissions.northeastern.edu/application-information/first-year-applicants/","prompts":[]},"Wake Forest University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.wfu.edu/2026/07/wake-forest-applications-open-august-1-heres-whats-new/","prompts":[{"text":"Why have you decided to apply to Wake Forest? Share with us anything that has made you interested in our institution.","limit":"100 words","required":true,"applies_to":"All applicants"},{"text":"List five books you've read that have intrigued you.","limit":"150 characters per book title","required":false,"applies_to":"Optional written supplement: choose one of four"},{"text":"Tell us what piques your intellectual curiosity or has helped you understand the world's complexity. This can include a work you've read, a project you've completed for a class, and even co-curricular activities in which you have been involved.","limit":"150 words","required":false,"applies_to":"Optional written supplement: choose one of four"},{"text":"Dr. Maya Angelou, renowned author, poet, civil-rights activist, and former Wake Forest University Reynolds Professor of American Studies, inspired others to celebrate their identities and to honor each person's dignity. Choose one of Dr. Angelou's powerful quotes. How does this quote relate to your lived experience or reflect how you plan to contribute to the Wake Forest community?","limit":"300 words","required":false,"applies_to":"Optional written supplement: choose one of four"},{"text":"Give us your Top Ten List. (The choice of theme is yours.)","limit":"100 characters per line","required":false,"applies_to":"Optional written supplement: choose one of four"}]},"Tulane University":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://admission.tulane.edu/apply/instructions","prompts":[]},"Davidson College":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://www.davidson.edu/admission-and-financial-aid/apply/first-year-applicants","prompts":[{"text":"There are just under 4,000 four-year colleges and universities in the United States. Being as specific as possible, what interests you most about Davidson College?","limit":"250-300 words","required":true,"applies_to":"All applicants"},{"text":"Davidson encourages students to explore curiosities in and out of the classroom. What is a topic, activity or idea that excites you? Tell us why. Examples may include hobbies, books, interactions, music, podcasts, movies, etc.","limit":"250-300 words","required":true,"applies_to":"All applicants"}]},"Amherst College":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://www.amherst.edu/admission/apply/firstyear/writingsupplement","prompts":[{"text":"\"Hope and curiosity - these are qualities that are the foundation of what Amherst College means, of everything that we do here. Curiosity is at the core of a liberal arts education - a spirit of inquiry that shapes not only what our students do in the classroom, but also how they learn from and about each other.\" - Michael A. Elliott, 20th President of Amherst College, address at Amherst College's 203rd Commencement. What does curiosity mean to you? How do you experience curiosity in your own life?","limit":"350 words","required":true,"applies_to":"Option A of the required supplement (choose one quotation); Option B is a graded paper instead"},{"text":"\"We seek an Amherst made stronger because it includes those whose experiences can enhance our understanding of our nation and our world. We do so in the faith that our humanity is an identity forged from diversity, and that our different perspectives enrich our inquiry, deepen our knowledge, strengthen our community, and prepare students to engage with an ever-changing world.\" - from the Trustee Statement on Diversity and Community. In what ways could your unique experiences enhance our understanding of our nation and our world?","limit":"350 words","required":true,"applies_to":"Option A of the required supplement (choose one quotation); Option B is a graded paper instead"},{"text":"\"We are working together to build a community that makes room for both true disagreement and true connection, one that practices the kind of recognition and robust negotiation that the everyday life of democracy requires, and one that explicitly prepares our students to work for the greater good in their professional and personal endeavors.\" - Presidential Priorities: Serving the Greater Good. Tell us about a time that you engaged with a viewpoint different from your own. How did you enter that engagement, and what did you learn about yourself from it?","limit":"350 words","required":true,"applies_to":"Option A of the required supplement (choose one quotation); Option B is a graded paper instead"}]},"Williams College":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.williams.edu/admission-aid/apply/first-year/","prompts":[]},"Swarthmore College":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.koppelmangroup.com/blog/2026/9/19/how-to-write-the-swarthmore-supplement-2026-2027","prompts":[{"text":"What aspects of your self-identity or personal background are most significant to you? Reflecting on the elements of your home, school, or other communities that have shaped your life, explain how you have grown in your ability to navigate differences when engaging with others, or demonstrated your ability to collaborate in communities other than your own.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"Tell us about a topic that has fascinated you recently - either inside or outside of the classroom. What made you curious about this? Has this topic connected across other areas of your interests? How has this experience shaped you and what encourages you to keep exploring?","limit":"250 words","required":true,"applies_to":"All applicants"}]},"Pomona College":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://www.pomona.edu/admissions/apply/first-year-applicants","prompts":[{"text":"What draws you to the subject(s) you selected as potential major(s)? If Undecided, share more about one of your academic passions or interests.","limit":"150 words","required":true,"applies_to":"All applicants"},{"text":"Reflecting on a community that you are a part of, what values or perspectives from that community would you bring to Pomona?","limit":"250 words","required":true,"applies_to":"All applicants (choose one of three short-response options)"},{"text":"Describe an experience you had outside the classroom that changed the way you think or how you engage with your peers. What was that experience and what did you learn from it?","limit":"250 words","required":true,"applies_to":"All applicants (choose one of three short-response options)"},{"text":"Choose any person or group of people in your life and share how they would describe you.","limit":"250 words","required":true,"applies_to":"All applicants (choose one of three short-response options)"}]},"University of Alabama":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://admissions.ua.edu/freshman/steps","prompts":[]},"Auburn University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.commonapp.org/explore/auburn-university","prompts":[]},"University of Alabama at Birmingham":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.uab.edu/admissions/apply/freshman/how-to-apply","prompts":[]},"University of Florida":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/university-of-florida-supplemental-essay-prompt-guide/","prompts":[{"text":"Please provide more details on your most meaningful commitment outside of the classroom while in high school and explain why it was meaningful. This could be related to an extracurricular activity, work, volunteering, an academic activity, family responsibility, or any other non-classroom activity.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"The UF Honors Program's mission is to connect, nurture and engage the next generation of scholars who change the world. How do you envision yourself contributing to this mission? Consider the people, experiences, resources, and aspirations that have shaped your journey thus far and your future plans.","limit":"400 words","required":true,"applies_to":"Honors Program applicants only"}]},"Florida State University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://admissions.fsu.edu/first-year/apply","prompts":[{"text":"Many FSU Honors students pursue double majors - often in completely different fields - to enrich their academic experience. If you could choose two majors offered at FSU from different departments, what would they be and why? Design an Honors Signature Course that explores a topic or issue at the intersection of these two majors. Name the course and provide a brief (2-3 sentence) description for the website. Describe in detail what is important for you that students gain from the class and suggest a campus resource, faculty member or organization to enhance their learning experience.","limit":"250-350 words","required":true,"applies_to":"University Honors Program and Presidential Scholars applicants only"}]},"University of Central Florida":{"common_app":true,"has_supplement":null,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/university-of-central-florida-supplemental-essay-prompt-guide/","prompts":[{"text":"Why did you choose to apply to UCF?","limit":"250 words","required":null,"applies_to":"All applicants"},{"text":"What qualities or unique characteristics do you possess that will allow you to contribute to the UCF community?","limit":"250 words","required":null,"applies_to":"All applicants"},{"text":"Please briefly elaborate on one of your extracurricular activities or work experiences.","limit":"250 words","required":null,"applies_to":"All applicants"}]},"University of South Florida":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.commonapp.org/explore/university-south-florida/","prompts":[]},"University of Miami":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://news.miami.edu/admissions/stories/2026/07/does-the-university-of-miami-require-a-supplemental-essay.html","prompts":[]},"University of Tennessee, Knoxville":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://admissions.utk.edu/apply/first-year/","prompts":[]},"University of Tennessee at Chattanooga":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.commonapp.org/explore/university-tennessee-chattanooga","prompts":[]},"Middle Tennessee State University":{"common_app":false,"has_supplement":false,"verification":"official","source_url":"https://www.mtsu.edu/how-to-apply/undergraduate/","prompts":[]},"University of South Carolina":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.sc.edu/about/offices_and_divisions/undergraduate_admissions/documents/2026-2027_application_guide.pdf","prompts":[]},"Clemson University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/clemson-university-supplemental-essay-prompt-guide/","prompts":[{"text":"If you wish to submit an optional statement specific to your Clemson application, you may upload it here.","limit":"","required":false,"applies_to":"All applicants"}]},"College of Charleston":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/college-of-charleston-supplemental-essay-prompt-guide/","prompts":[{"text":"Our community lives by the words \"Know Thyself\", a consistent reminder of the personal, educational, and social growth opportunities that a College of Charleston education affords its students. How would attending the College of Charleston help you discover your unique purpose, identity, and goals?","limit":"350 words","required":false,"applies_to":"All applicants"}]},"University of North Carolina at Chapel Hill":{"common_app":true,"has_supplement":false,"verification":"secondary","source_url":"https://www.collegetransitions.com/blog/unc-chapel-hill-supplemental-essay-prompts-3","prompts":[]},"North Carolina State University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.ncsu.edu/apply/first-year/","prompts":[{"text":"Explain why you selected the academic program(s) above and why you are interested in studying these at NC State.","limit":"","required":true,"applies_to":"All applicants"},{"text":"Think about a time when your curiosity led you to not just learn, but to act. How did you learn more, and what tangible steps did you take as a result of what you learned? What insights about yourself, others, or the world did you take away from this process of learning and doing? You are encouraged to draw from any meaningful experience, whether it happened in school, at home, in your community, at work, or anywhere else your learning and growth have taken shape.","limit":"600 words","required":false,"applies_to":"University Honors Program applicants (required if applying to Honors, due Nov 1)"}]},"University of North Carolina at Charlotte":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://admissions.charlotte.edu/apply/first-year-students/application-requirements/","prompts":[]},"East Carolina University":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://admissions.ecu.edu/apply/freshmen/","prompts":[]},"Appalachian State University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/appalachian-state-university-supplemental-essay-prompt-guide/","prompts":[{"text":"After reviewing our institutional mission statement, please describe why you are interested in attending Appalachian State.","limit":"250 words","required":true,"applies_to":"All applicants"}]},"University of Mississippi":{"common_app":true,"has_supplement":true,"verification":"prior_year","source_url":"https://olemiss.edu/admissions/undergraduate-admissions/application-process/","prompts":[{"text":"Describe your academic interests and how the University of Mississippi will help you achieve your goals. How do you envision yourself contributing to the academic community?","limit":"300-500 words","required":true,"applies_to":"Sally McDonnell Barksdale Honors College applicants"},{"text":"Describe a piece of art, music, or writing you have found powerful, and explain how it has impacted you.","limit":"500-700 words","required":true,"applies_to":"Sally McDonnell Barksdale Honors College applicants"}]},"Mississippi State University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.admissions.msstate.edu/howtoapply","prompts":[]},"Louisiana State University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://www.lsu.edu/honors/student-info/ohc-admissions.php","prompts":[{"text":"In a paragraph of no more than seven sentences, describe yourself and your current goals. Be creative and informative, and do not simply repeat what was listed in other areas of your application. Think carefully about what motivates you, what qualities of character you contribute to the world, what life experiences you've had, what makes you a unique human person.","limit":"No more than seven sentences","required":false,"applies_to":"Ogden Honors College applicants (writing sample due Dec 1; Common App essay accepted instead)"}]},"University of Kentucky":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://honors.uky.edu/prospective","prompts":[{"text":"Kentucky is one of four states that is a Commonwealth. The term means the state is for the common good. What do you consider to be 'the common good' and how do you hope to use your life experiences, challenges, uniqueness, and intellect to contribute to the common good in your community, as you define it?","limit":"500 words or fewer","required":false,"applies_to":"Lewis Honors College applicants (Early Action, Dec 1)"}]},"University of Louisville":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.commonapp.org/explore/university-louisville","prompts":[]},"University of Virginia":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/university-of-virginia-uva-supplemental-essay-prompt-guide/","prompts":[{"text":"In the field of nursing, you will encounter and impact real human lives. Please explain why you feel this is important as you choose this field as your future.","limit":"Around 250 words","required":true,"applies_to":"School of Nursing applicants only"}]},"Virginia Tech":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.vt.edu/admissions/undergraduate/apply/ut-prosim-short-answer-questions.html","prompts":[{"text":"Virginia Tech's motto is 'Ut Prosim' which means 'That I May Serve'. Share how you contribute to a community that is important to you. How long have you been involved? What have you learned and how would you like to share that with others at Virginia Tech?","limit":"120 words","required":true,"applies_to":"All applicants"},{"text":"Have you had an experience when you or someone you know were not being included? Did you reach out to anyone for assistance, direction, or resources? Were you able to affect change and/or influence others? Did this experience change your perspective and if so, how?","limit":"120 words","required":true,"applies_to":"All applicants"},{"text":"Share a time when you were most proud of yourself either as a role model or when you displayed your leadership. What specific skills did you contribute to the experience? How did others rely on you for guidance? What did you learn about yourself during this time?","limit":"120 words","required":true,"applies_to":"All applicants"},{"text":"Describe a goal that you have set and the steps you will take to achieve it. What made you set this goal for yourself? What is your timeline to achieve this goal? Who do you seek encouragement or guidance from and how do they support your progress as you work on this goal?","limit":"120 words","required":true,"applies_to":"All applicants"}]},"University of Maryland":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegetransitions.com/blog/university-of-maryland-supplemental-essay-prompts/","prompts":[{"text":"If I could travel anywhere, I would go to…","limit":"650 characters","required":true,"applies_to":"All applicants"},{"text":"The most interesting fact I ever learned from research was…","limit":"650 characters","required":true,"applies_to":"All applicants"},{"text":"In addition to my major, my academic interests include…","limit":"650 characters","required":true,"applies_to":"All applicants"},{"text":"My favorite thing about last Monday was…","limit":"650 characters","required":true,"applies_to":"All applicants"},{"text":"Something you might not know about me is…","limit":"650 characters","required":true,"applies_to":"All applicants"},{"text":"Because we know that diversity benefits the educational experience of all students, the University of Maryland values diversity in all of its many forms. This includes (but is not limited to) racial, socio-economic, gender, geographical, and sexual orientation. We are interested in hearing about your own individual life experiences. In a few sentences, will you please describe how you have learned, grown, been inspired or developed skills through one or more components of diversity.","limit":"650 characters","required":true,"applies_to":"All applicants"}]},"Pennsylvania State University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.psu.edu/resources/first-year-students/steps-to-apply","prompts":[]},"Ohio State University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://undergrad.osu.edu/apply/freshmen-columbus/common-app","prompts":[]},"University of Michigan":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.umich.edu/apply/first-year-applicants/essay-questions","prompts":[{"text":"At the University of Michigan, we are focused on developing leaders and citizens who will challenge the present and enrich the future. In your essay, share with us how you are prepared to contribute to these goals. This could include the people, places, experiences, or aspirations that have shaped your journey and future plans.","limit":"100-300 words","required":true,"applies_to":"All applicants"},{"text":"Describe the unique qualities that attract you to the specific undergraduate college or school (including preferred admission and dual degree programs) to which you are applying at the University of Michigan. How would that curriculum support your interests?","limit":"100-550 words","required":true,"applies_to":"All applicants"},{"text":"Choose a current event or issue in your community and discuss the business implications. Propose a solution that incorporates business principles or practices. The review panel will look for creativity, drawing connections, and originality.","limit":"Approximately 500 words","required":true,"applies_to":"Ross School of Business applicants (portfolio)"}]},"Michigan State University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://admissions.msu.edu/apply/first-year/how-to-apply","prompts":[]},"Purdue University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://admissions.purdue.edu/apply/essay.php","prompts":[{"text":"How will opportunities at Purdue support your interests, both in and out of the classroom? (Respond in 250 words or fewer.)","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"Briefly discuss your reasons for choosing your major and your interest in studying at this campus location (Indianapolis or West Lafayette) (Respond in 250 words or fewer)","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"Briefly discuss your reasons for pursuing the alternate major and campus location (Indianapolis or West Lafayette) you have selected.","limit":"250 words","required":true,"applies_to":"Applicants who list an alternate major and campus"}]},"Indiana University Bloomington":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://bloomington.iu.edu/admissions/apply/application-faqs.html","prompts":[{"text":"In 200–400 words, describe your academic and career plans and any special interest (for example, undergraduate research, academic interests, leadership opportunities, etc.) that you are eager to pursue as an undergraduate at Indiana University. Also, if you encountered any unusual circumstances, challenges, or obstacles in pursuit of your education, you may share those experiences and how you overcame them.","limit":"200-400 words","required":true,"applies_to":"Apply IU applicants (IU's FAQ says Common App applicants instead choose a Common App prompt)"}]},"University of Texas at Austin":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.utexas.edu/apply/freshman/essays-and-short-answers/","prompts":[{"text":"Why are you interested in the major you indicated as your first-choice major?","limit":"250-300 words (up to 40 lines)","required":true,"applies_to":"All applicants"},{"text":"Think of all the activities - both in and outside of school - that you have been involved with during high school. Which one are you most proud of and why?","limit":"250-300 words (up to 40 lines)","required":true,"applies_to":"All applicants"},{"text":"Please share background on events or special circumstances that you feel may have impacted your high school academic performance.","limit":"250-300 words","required":false,"applies_to":"All applicants"}]},"Texas A&M University":{"common_app":true,"has_supplement":true,"verification":"official","source_url":"https://admissions.tamu.edu/apply/freshman","prompts":[{"text":"Tell us your story. What unique opportunities or challenges have you experienced throughout your high school career that have shaped who you are today?","limit":"750 words","required":true,"applies_to":"All applicants"},{"text":"Describe a life event which you feel has prepared you to be successful in college.","limit":"250 words","required":true,"applies_to":"All applicants"},{"text":"In a few words, what are some of your life goals and objectives?","limit":"100 words","required":true,"applies_to":"All applicants"},{"text":"In a few words, why have you chosen your academic major(s)?","limit":"100 words","required":true,"applies_to":"All applicants"},{"text":"We know you have a lot of options. In a few words, why did you choose to apply to Texas A&M?","limit":"100 words","required":true,"applies_to":"All applicants"},{"text":"Briefly describe any educational plans you have beyond earning your bachelor's degree.","limit":"100 words","required":true,"applies_to":"All applicants"},{"text":"Are there experiences or opportunities that have shaped or influenced your abilities or academic record, which you have not already written about?","limit":"250 words","required":false,"applies_to":"All applicants"}]},"University of Houston":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.uh.edu/undergraduate-admissions/apply/incoming-freshman","prompts":[]},"Arizona State University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://admission.asu.edu/apply/first-year/admission","prompts":[]},"University of California, Los Angeles":{"common_app":false,"has_supplement":true,"verification":"official","source_url":"https://admission.universityofcalifornia.edu/how-to-apply/applying-as-a-freshman/personal-insight-questions.html","prompts":[{"text":"Describe an example of your leadership experience in which you have positively influenced others, helped resolve disputes or contributed to group efforts over time.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Every person has a creative side, and it can be expressed in many ways: problem solving, original and innovative thinking, and artistically, to name a few. Describe how you express your creative side.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"What would you say is your greatest talent or skill? How have you developed and demonstrated that talent over time?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Describe how you have taken advantage of a significant educational opportunity or worked to overcome an educational barrier you have faced.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Describe the most significant challenge you have faced and the steps you have taken to overcome this challenge. How has this challenge affected your academic achievement?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Think about an academic subject that inspires you. Describe how you have furthered this interest inside and/or outside of the classroom.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"What have you done to make your school or your community a better place?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Beyond what has already been shared in your application, what do you believe makes you a strong candidate for admissions to the University of California?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"}]},"University of California, Berkeley":{"common_app":false,"has_supplement":true,"verification":"official","source_url":"https://admission.universityofcalifornia.edu/how-to-apply/applying-as-a-freshman/personal-insight-questions.html","prompts":[{"text":"Describe an example of your leadership experience in which you have positively influenced others, helped resolve disputes or contributed to group efforts over time.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Every person has a creative side, and it can be expressed in many ways: problem solving, original and innovative thinking, and artistically, to name a few. Describe how you express your creative side.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"What would you say is your greatest talent or skill? How have you developed and demonstrated that talent over time?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Describe how you have taken advantage of a significant educational opportunity or worked to overcome an educational barrier you have faced.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Describe the most significant challenge you have faced and the steps you have taken to overcome this challenge. How has this challenge affected your academic achievement?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Think about an academic subject that inspires you. Describe how you have furthered this interest inside and/or outside of the classroom.","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"What have you done to make your school or your community a better place?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"},{"text":"Beyond what has already been shared in your application, what do you believe makes you a strong candidate for admissions to the University of California?","limit":"350 words","required":false,"applies_to":"All applicants: answer any 4 of the 8 questions"}]},"Belmont University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.belmont.edu/admissions/first-year/apply.html","prompts":[]},"Samford University":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://www.samford.edu/admission/apply","prompts":[]},"Furman University":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://furman.edu/admissions-aid/apply","prompts":[]},"Wofford College":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://www.wofford.edu/admission/apply","prompts":[]},"Elon University":{"common_app":true,"has_supplement":true,"verification":"secondary","source_url":"https://www.collegeessayadvisors.com/supplemental-essay/elon-university-supplemental-essay-prompt-guide/","prompts":[{"text":"What at Elon has caught your eye - programs, opportunities, or experiences you can't wait to try?","limit":"150 words","required":null,"applies_to":"All applicants"},{"text":"What aspect of your identity do you find most meaningful, and why?","limit":"200 words","required":null,"applies_to":"All applicants"},{"text":"Name three songs from your perfect playlist. We look forward to creating a Spotify playlist from your answers.","limit":"75 characters per field (title and artist for each of 3 songs)","required":null,"applies_to":"All applicants"},{"text":"Tell us your top 5. You may choose any theme for your top 5. Explain why these are your top 5:","limit":"100 characters per list entry; 150 words for the explanation","required":null,"applies_to":"All applicants"}]},"High Point University":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://www.highpoint.edu/admissions/apply/","prompts":[]},"Sewanee: The University of the South":{"common_app":true,"has_supplement":null,"verification":"unconfirmed","source_url":"https://new.sewanee.edu/admission-aid/application-process/application-review/first-year-applicants/","prompts":[]},"Rhodes College":{"common_app":true,"has_supplement":false,"verification":"official","source_url":"https://rhodes.edu/admission-aid/apply-rhodes/first-year-application-checklist","prompts":[]},"Berea College":{"common_app":null,"has_supplement":false,"verification":"official","source_url":"https://berea.smartcatalogiq.com/current/catalog/admissions-and-financial-aid/admissions/applying-as-a-freshman","prompts":[]}}/*END*/;</script>

 '<div class="rail"><span class="where" id="wt-where">Start</span><div class="bar"><i id="wt-bar"></i></div><span class="where" id="wt-left">15 min</span></div>'+
 '<div class="st" id="wt0"><div class="stop"><b>15 minutes</b> Self-paced</div><h1>The reader has your grades. What don\'t they know yet?</h1><p class="lead">An admissions reader sees your transcript, your activities, and your scores. The personal statement is the only place they hear you. This walk-through gets you from a blank page to a plan for your first draft.</p><p class="hint"><strong>7 stops</strong>, each timed. <strong>2 quick decisions</strong> you make as you go. Leave with <strong>your essay type, your hook, and your outline</strong>.</p>'+wtNav(null,"wt1","Start the walk-through")+'</div>'+
 '<div class="st" id="wt1"><div class="stop"><b>Stop 1</b> 2 min · What this essay does</div><h2>It is a story, not a summary.</h2><p class="lead">A strong personal statement does four jobs. Everything here comes back to one of them.</p><div class="cards"><div class="card"><h3>Tells a story with purpose</h3><p>One defining moment, challenge, or experience that shaped who you are.</p></div><div class="card"><h3>Shows reflection and growth</h3><p>Not just what happened. What you learned about yourself.</p></div><div class="card"><h3>Connects to your future</h3><p>How the experience shapes your goals and your plans after high school.</p></div><div class="card"><h3>Sounds like you</h3><p>The reader meets the real person behind the numbers.</p></div></div><h3>Quick check. Which one is a personal statement?</h3><div class="choice" id="wt-qc"><button class="pick" aria-pressed="false" data-qc="letter"><small>Example 1</small>“I\'m excited to be in your program this semester and learn more about career pathways in healthcare.”</button><button class="pick" aria-pressed="false" data-qc="ps"><small>Example 2</small>“My experience caring for my younger brother taught me responsibility, and it inspired me to pursue nursing.”</button></div><div class="reveal" id="wt-qcout" hidden></div>'+wtNav("wt0","wt2","Next: what the reader feels")+'</div>'+
 '<div class="st" id="wt2"><div class="stop"><b>Stop 2</b> 1 min · Two openings</div><h2>Same student. Same job. Which one do you keep reading?</h2><div class="choice"><button class="pick" aria-pressed="false" data-open="A"><small>Opening A</small>I have always been a hardworking and responsible person. Throughout high school I have balanced school, a part-time job, and helping my family. These experiences taught me leadership, time management, and perseverance, and they have prepared me for college.</button><button class="pick" aria-pressed="false" data-open="B"><small>Opening B</small>The register froze at 9:40 on a Saturday night with eleven people in line and my manager already gone. I had worked at the store for three weeks. I pulled the calculator off the shelf, tore a sheet from the receipt roll, and told the first customer, “I\'m going to do this the old way. Check my math.”</button></div><div class="reveal" id="wt-openout" hidden></div><p class="lead">The rule for the whole essay: <mark>one moment, one place, details only you would know.</mark></p>'+wtNav("wt1","wt3","Next: find your essay type")+'</div>'+
