 if(!dl&&!window.claude){var u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast("Saved "+filename);return;}
 if(!dl){toast("Downloads are not available in this view. Open the page in Claude and try again.");return;}
 dl.save({filename:filename,data:data}).then(function(){toast("Saved "+filename);},function(err){var c=err&&err.code;
  toast(c==="declined"?"Download canceled.":c==="rate_limited"?"A download is already waiting. Finish that one first.":"This download is not available here.");});
}
function saveWord(key){
 var D=window.docx;if(!D){toast("The Word export did not load. Check your connection and reload.");return;}
 var F=FORMS[key],kids=[];
 function P(text,o){o=o||{};return new D.Paragraph({heading:o.h,spacing:{after:o.after==null?120:o.after},children:[new D.TextRun({text:text,bold:o.b,italics:o.i,size:o.size,color:o.color})]});}
 function multi(text,o){return String(text).split(/\n+/).map(function(l){return P(l,o);});}
 kids.push(P(F.title,{h:D.HeadingLevel.TITLE}));
 kids.push(P(who()+(S.me.school?"  |  "+S.me.school:"")+(S.me.grad?"  |  Class of "+S.me.grad:"")+"  |  "+fmt(new Date()),{color:"555555",after:240}));
 if(key==="ps"){var parts=psParts();kids.push(P("Draft 1"+(S.forms.ps.type?"  (Type "+S.forms.ps.type+")":""),{h:D.HeadingLevel.HEADING_1}));
  if(parts.length)parts.forEach(function(p){kids=kids.concat(multi(p,{size:24,after:200}));});else kids.push(P("No paragraphs written yet.",{i:true}));
  kids.push(P("Word count: "+words(parts.join(" "))+" (target 500 to 650)",{color:"555555",after:320}));
  kids.push(P("Planning notes",{h:D.HeadingLevel.HEADING_1}));}
 if(key==="rec"){kids.push(P("Request message",{h:D.HeadingLevel.HEADING_1}));kids=kids.concat(multi(recEmail()));kids.push(P("Thank-you note",{h:D.HeadingLevel.HEADING_1}));kids=kids.concat(multi(recThanks()));}
 if(key==="acts"){var M=S.me,B=S.forms.brag;
  kids.push(P("Education",{h:D.HeadingLevel.HEADING_2}));kids.push(P((M.school||"High school")+(M.grad?", Class of "+M.grad:"")+(M.gpa?"  |  GPA "+M.gpa+(M.wgpa?" unweighted, "+M.wgpa+" weighted":""):"")+(M.sat?"  |  SAT "+M.sat:"")+(M.act?"  |  ACT "+M.act:"")));
  kids.push(P("Activities",{h:D.HeadingLevel.HEADING_2}));
  if(!S.acts.length)kids.push(P("No activities listed yet.",{i:true}));
  S.acts.forEach(function(a,i){kids.push(P((i+1)+". "+(a.role||"Role")+(a.org?", "+a.org:"")+(a.type?"  ("+a.type+")":""),{b:true,after:40}));if(a.desc)kids.push(P(a.desc,{after:40}));
   var meta=[a.grades?"Grades "+a.grades:"",a.hrs?a.hrs+" hours per week":"",a.wks?a.wks+" weeks per year":""].filter(Boolean).join("  |  ");kids.push(P(meta,{color:"555555",after:160}));});
  [["awards","Awards and honors"],["service","Community service"],["work","Work and family responsibilities"],["programs","Programs and summer learning"]].forEach(function(s){if(B[s[0]]){kids.push(P(s[1],{h:D.HeadingLevel.HEADING_2}));kids=kids.concat(multi(B[s[0]]));}});}
 F.sections.forEach(function(s){if(s.show&&!s.show())return;
  kids.push(P(s.h,{h:D.HeadingLevel.HEADING_2}));
  s.f.forEach(function(f){if(f.show&&!f.show())return;var v=fval(key,f.id);if(f.type==="date"&&v)v=fmt(pd(v));
   kids.push(P(f.label,{b:true,after:40}));kids=kids.concat(multi(v||"________________________________________",{after:160}));});});
 if(key==="rec"&&S.recs.length){kids.push(P("Recommender list",{h:D.HeadingLevel.HEADING_2}));
  var head=["Recommender","Role","For","Asked on","Said yes","Brag sheet","Submitted","Thank-you"],keys=["name","role","forw","asked","yes","brag","sub","thanks"];
  function tr(vals,b){return new D.TableRow({children:vals.map(function(v){return new D.TableCell({children:[P(v||"",{b:b,after:0,size:18})]});})});}
  kids.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:[tr(head,true)].concat(S.recs.map(function(r){return tr(keys.map(function(k){return k==="asked"&&r[k]?fmt(pd(r[k])):r[k];}));}))}));}
 if(F.checks){kids.push(P(key==="ps"?"Self-check":"Checklist",{h:D.HeadingLevel.HEADING_2}));F.checks.forEach(function(c,i){kids.push(P((S.forms[key]["chk"+i]?"[x] ":"[  ] ")+c,{after:60}));});}
 var doc=new D.Document({creator:who(),title:F.title,styles:{default:{document:{run:{font:"Calibri",size:22}}}},sections:[{children:kids}]});
 D.Packer.toBlob(doc).then(function(blob){offer(who()+" - "+F.file+".docx",blob);},function(){toast("The Word file could not be built. Try again.");});
}

 var allc=COSTS.concat(GIFT,SELF);
 sheet("Award Letters",[["College"].concat(allc.map(function(c){return c[1];}),["Total cost","Net cost after free money","Left to pay"])].concat(S.awards.map(function(a){var m=awardMath(a);return [a.name||""].concat(allc.map(function(c){return num(a[c[0]]);}),[m.cost,m.net,m.left]);})),[32,16,16,16,16,12,14,12,12,14,24,14]);
 sheet("Activities",[["Type","Position or role","Organization","What I did","Grades","Hours per week","Weeks per year"]].concat(S.acts.map(function(a){return [a.type||"",a.role||"",a.org||"",a.desc||"",a.grades||"",a.hrs||"",a.wks||""];})),[22,26,28,70,12,14,14]);
 sheet("Accounts",[["Account or portal","Web address","Username or email","Notes"]].concat(S.accounts.map(function(a){return [a.name||"",a.url||"",a.user||"",a.notes||""];})),[30,36,30,40]);
 offer(who()+" - College Tracker.xlsx",X.write(wb,{type:"array",bookType:"xlsx",cellDates:true}));
}
window.__caw={S:S,saveWord:saveWord,saveXlsx:saveXlsx,setDl:function(d){dl=d;}};
render();
})();
