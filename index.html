<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>College Application Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky workspace bar with four rooms (Start, Tracker, Essay, Templates); each room is one working column, forms read like worksheets, dates set in mono like a deadline stamp. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#13252a; --muted:#56696d; --line:#d3dcda;
  --accent:#0d6259; --accent-ink:#ffffff; --mark:#f4cf4a; --mark-ink:#3a2e00;
  --warn:#a23a16; --ok:#1c6b3c; --soft:#e6eeec;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a1c; --surface:#172528; --ink:#e8efee; --muted:#9fb1b3; --line:#2c3f42;
  --accent:#58c2b3; --accent-ink:#06211e; --mark:#e3bd3a; --mark-ink:#2a2100;
  --warn:#ff9c78; --ok:#7fd3a0; --soft:#1e3034; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1a1c; --surface:#172528; --ink:#e8efee; --muted:#9fb1b3; --line:#2c3f42;
  --accent:#58c2b3; --accent-ink:#06211e; --mark:#e3bd3a; --mark-ink:#2a2100;
  --warn:#ff9c78; --ok:#7fd3a0; --soft:#1e3034; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in,.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font:700 1.1rem var(--display);letter-spacing:-.01em}
nav{display:flex;flex-wrap:wrap;gap:4px}
.tab,.sub{font:600 .95rem var(--body);color:var(--muted);background:none;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sub{border:1px solid var(--line);background:var(--surface)}
.sub[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:24px}
h1{font:700 clamp(1.8rem,5vw,2.7rem)/1.08 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:20ch}
h2{font:700 1.45rem/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 1.05rem/1.3 var(--body);margin:0}
p{margin:0;max-width:65ch}
.lede{color:var(--muted);font-size:1.08rem}
.eyebrow{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.steps .n{font:500 .95rem var(--mono);color:var(--accent)}
.steps .d{color:var(--muted);font-size:.95rem}
.steps .t{min-width:0}
@media (max-width:560px){.steps li{grid-template-columns:2.2rem 1fr}.steps .go{grid-column:2}}
.btn{font:600 .95rem var(--body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{font:500 .72rem var(--mono);padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);max-width:100%}
.pill.on{background:var(--mark);color:var(--mark-ink)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:600}
.hint{color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input,select,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.wc{font:400 .8rem var(--mono);color:var(--muted)}
.wc.over{color:var(--warn)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td input[type=text]{min-width:190px}td input,td select{min-width:130px;padding:5px 8px;font-size:.93rem}
td.date,.date{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.late{color:var(--warn);font-weight:600}
.done{color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);padding:18px;text-align:center}
.note{border-left:3px solid var(--mark);padding:4px 0 4px 12px;color:var(--muted);font-size:.95rem}
.draft{white-space:pre-wrap;font-size:1rem;line-height:1.6;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:14px;min-height:60px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.list>div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}.list .pill{white-space:nowrap}
.list span{min-width:0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
@media (prefers-reduced-motion:no-preference){.tab,.sub,.btn{transition:background .12s,color .12s}}

/* ---------- essay walk-through (scoped .wt) ---------- */
.wt{display:flex;flex-direction:column;gap:0;font-size:1.05rem}
.wt .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:8px;font:600 .85rem var(--body)}
.wt .rail .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:0}
.wt .rail .bar i{display:block;height:100%;width:0;background:var(--mark);transition:width .2s}
.wt .rail .where{color:var(--muted);white-space:nowrap;font-family:var(--mono);font-weight:500;font-size:.78rem}
.wt .st{padding-block:40px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.wt .st:last-child{border-bottom:0}
.wt .stop{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.wt .stop b{background:var(--mark);color:var(--mark-ink);padding:2px 8px;border-radius:3px;font-weight:600}
.wt h1{max-width:24ch}
.wt .lead{color:var(--muted);font-size:1.12rem;max-width:60ch}
.wt mark{background:linear-gradient(transparent 45%,var(--mark) 45%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px}
.wt .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.wt .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.wt .card p{color:var(--muted);font-size:1rem}
.wt .pick{display:block;width:100%;text-align:left;font:400 1.05rem/1.5 var(--body);padding:16px 18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.wt .pick[aria-pressed="true"]{border-color:var(--accent)}
.wt .pick small{display:block;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wt .choice{display:flex;flex-direction:column;gap:10px}
.wt .reveal{padding:14px 16px;border-left:4px solid var(--mark);background:var(--surface);font-size:1rem}
.wt .qrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.wt .qrow:last-of-type{border-bottom:1px solid var(--line)}
.wt .yn{display:flex;gap:8px}
.wt .yn .btn{min-width:64px}
.wt .typecard{background:var(--ink);color:var(--bg);border-radius:10px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:start}
.wt .typecard .letter{font:700 80px/.9 var(--display);color:var(--mark);grid-row:span 3}
.wt .typecard h3{font:700 1.3rem/1.2 var(--display);color:var(--bg)}
.wt .typecard p{color:var(--bg);opacity:.8;font-size:1rem;max-width:none}
.wt .typecard .tag{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mark)}
.wt .flow{display:flex;flex-direction:column;gap:8px;font:600 .95rem var(--body)}
.wt .flow div{padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;position:relative;background:var(--bg)}
.wt .flow div+div::before{content:"";position:absolute;left:20px;top:-9px;width:2px;height:9px;background:var(--muted)}
.wt .snaps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font:600 .9rem var(--body);text-align:center}
.wt .snaps div{padding:12px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg)}
.wt .theme{text-align:center;font:600 .9rem var(--body);padding:9px;border:2px solid var(--mark);border-radius:6px;background:var(--bg)}
.wt details{border-top:1px solid var(--line)}
.wt details:last-of-type{border-bottom:1px solid var(--line)}
.wt summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:32px 1fr auto;gap:4px 12px;align-items:baseline;padding:14px 0}
.wt summary::-webkit-details-marker{display:none}
.wt summary .n{font:500 .95rem var(--mono);color:var(--accent)}
.wt summary .t{font:700 1.05rem var(--display)}
.wt summary .d{font-size:.95rem;color:var(--muted);grid-column:2}
.wt summary .plus{color:var(--muted);font-size:1.4rem;grid-row:span 2;line-height:1}
.wt details[open] summary .plus{transform:rotate(45deg)}
.wt details .body{padding:0 0 18px 44px}
.wt .quote{font-size:1.05rem;line-height:1.5;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:none}
.wt .chartrow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px;font-size:1rem}
.wt .chartrow div{display:grid;grid-template-columns:100px 1fr;gap:8px}
.wt .chartrow b{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.wt .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.wt .step{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.wt .step .k{font:700 1.9rem/1 var(--display);color:var(--muted)}
.wt .step p{color:var(--muted);font-size:1rem}
.wt .w{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);padding:2px 8px;border-radius:3px;display:inline-block;margin-top:6px}
.wt .plan{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wt .plan li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:1.05rem}
.wt .plan li span{display:inline-block;width:20px;height:20px;border:2px solid var(--mark);border-radius:4px;margin-top:4px}
.wt .navr{display:flex;justify-content:space-between;gap:12px;font:600 .95rem var(--body)}
.wt .navr .btn.ghost{border-color:var(--line);color:var(--muted)}
@media (max-width:520px){.wt .typecard{grid-template-columns:1fr}.wt .typecard .letter{grid-row:auto;font-size:60px}.wt .snaps{grid-template-columns:1fr}.wt details .body{padding-left:0}.wt .qrow{grid-template-columns:1fr}}
</style>
