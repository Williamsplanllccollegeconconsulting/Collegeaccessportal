 '<div class="st" id="wt4"><div class="stop"><b>Stop 4</b> 2 min · Two ways to build it</div><h2>Narrative follows one thread. Montage ties snapshots to a theme.</h2><div class="two"><div class="card"><div class="stop"><b>Types A and C</b></div><h3>Narrative</h3><div class="flow"><div>1 · The challenge and its effects</div><div>2 · What I did about it</div><div>3 · What I learned, and where it takes me</div></div><p>Each part is about a third of the essay. Spend the most words on part 2. That is where the reader meets you.</p></div><div class="card"><div class="stop"><b>Types B and D</b></div><h3>Montage</h3><div class="theme">One theme: home, food, curiosity, helping others...</div><div class="snaps"><div>Moment 1</div><div>Moment 2</div><div>Moment 3</div></div><p>Three snapshot moments from different parts of your life. Each shows a value and ends with the insight: so what?</p></div></div>'+wtNav("wt3","wt5","Next: seven ways to open")+'</div>'+
 '<div class="st" id="wt5"><div class="stop"><b>Stop 5</b> 3 min · Hooks</div><h2>Seven ways to open. Pick one and the first paragraph writes itself.</h2><p class="lead">A hook works when it leaves the reader with a question. Open each one to see what it is and a sample line in that style.</p><div>'+hooks.map(function(h,i){return '<details><summary><span class="n">'+(i+1)+'</span><span class="t">'+h[0]+'</span><span class="plus">+</span><span class="d">'+h[1]+'</span></summary><div class="body"><div class="quote">'+h[2]+'</div></div></details>';}).join("")+'</div><p class="hint">All seven samples are the same moment from one student\'s chart. The hook is a choice about how to deliver the moment, not a choice of topic.</p><div class="two"><div class="chartrow"><div><b>Challenge</b><span>New job, closing alone</span></div><div><b>Effects</b><span>Register froze, 11 in line</span></div><div><b>Actions</b><span>Rang every sale by hand</span></div><div><b>Values</b><span>Responsibility, calm, honesty</span></div></div><p class="lead" style="font-size:1.05rem">Four short notes on a brainstorm chart became every opening above. Your chart row is enough to start. You do not need a finished idea.</p></div>'+wtNav("wt4","wt6","Next: build the draft")+'</div>'+
 '<div class="st" id="wt6"><div class="stop"><b>Stop 6</b> 2 min · From chart to draft</div><h2>Four steps take you to a complete first draft.</h2><p class="lead">The Personal Statement Builder on this site walks these steps with fill-in boxes and live word counts. Here is what each one asks of you.</p><div class="plan" style="display:grid;gap:10px"><div class="step"><div class="k">1</div><div><h3>Your hook</h3><p>Plan the moment, where you were, and one thing you saw or said. Pick one of the seven hooks and write 3 to 5 sentences.</p><span class="w">About 75 words</span></div></div><div class="step"><div class="k">2</div><div><h3>Your body</h3><p>Narrative: five paragraphs with sentence starters, from the challenge to what you learned. Montage: three snapshot moments, each with a value and an insight.</p><span class="w">375 to 475 words</span></div></div><div class="step"><div class="k">3</div><div><h3>Your ending</h3><p>What you understand now, where it shows up this month, and where you are taking it next. End on something you do, not a statement about life.</p><span class="w">About 100 words</span></div></div><div class="step"><div class="k">4</div><div><h3>Your check</h3><p>Read it out loud once. Eight boxes to tick, from “starts in one moment” to “sounds like me.”</p><span class="w">500 to 650 words total</span></div></div></div>'+wtNav("wt5","wt7","Next: what to do now")+'</div>'+
 '<div class="st" id="wt7"><div class="stop"><b>Stop 7</b> 1 min · Before you leave this page</div><h2>You have a type and a hook. Here is the rest of the week.</h2><ul class="plan"><li><span></span><div>Open the Personal Statement Builder and fill in your name, your essay type, and your structure.</div></li><li><span></span><div>Tonight: write your chart row and your hook. Three to five sentences is enough.</div></li><li><span></span><div>By day 3: write the body, following your structure.</div></li><li><span></span><div>By day 7: finish the ending, run the check, and turn in Draft 1. First feedback is on your story and structure, never spelling.</div></li></ul><div class="row"><button class="btn" data-go="essay">Open the Personal Statement Builder</button><a class="btn ghost" href="#wt0" data-wt="wt0">Back to the top</a></div><p class="note">Your first draft does not need to be good. It needs to exist. Everything after that is revision.</p></div>'+
